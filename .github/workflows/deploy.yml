name: Deploy to GitHub Pages

# main에 push(= PR이 병합)되면 웹을 빌드해서 GitHub Pages에 배포한다. Actions 탭에서 수동 실행도 가능
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 권한만 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 끝까지 마친다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v5

      # 버전을 적지 않으면 package.json의 "packageManager"를 따른다
      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node LTS 설정 (pnpm 캐시)
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 배포 전에 테스트를 한 번 더 돌려, 깨진 상태로 배포되지 않게 한다
      - name: 테스트
        run: pnpm test

      # tsc -b && vite build. 결과물은 apps/web/dist (base: /memory-poker/)
      - name: 웹 빌드
        run: pnpm --filter web build

      - name: Pages 설정
        uses: actions/configure-pages@v6

      - name: 빌드 결과 업로드
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v5
